# ClusterPolicy CR spec for OCP — base values
# Training/inference overlays extend via GPU-specific CR spec files

operator:
  defaultRuntime: crio
driver:
  enabled: true
  usePrecompiled: true
  version: "570.86.15"
  rdma:
    enabled: true
    useHostMofed: false
cdi:
  enabled: true
  default: true
dcgmExporter:
  enabled: true
  serviceMonitor:
    enabled: true
devicePlugin:
  enabled: false
toolkit:
  enabled: true
  installDir: /usr/local/nvidia
gdrcopy:
  enabled: true
# NFD is installed as a standalone OLM operator on OCP (Red Hat's nfd operator).
# Disable the GPU Operator's built-in NFD sub-chart to avoid conflicts.
nfd:
  enabled: false
sandboxWorkloads:
  enabled: false
